name: iOS native build

# On demand only: run from the Actions tab after native-affecting changes
# (Expo/React Native upgrades, native modules, camera/OCR, permissions).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_NUTRITION_DATA_AUTHORITY: local
      EXPO_PUBLIC_NUTRITION_DEPLOYMENT_MODE: test
      EXPO_PUBLIC_NUTRITION_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm exec -- expo prebuild --clean --platform ios
      - name: Build for simulator
        run: |
          workspace="$(ls -d ios/*.xcworkspace | head -1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          test "${PIPESTATUS[0]}" -eq 0
