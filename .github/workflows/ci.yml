name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_NUTRITION_DATA_AUTHORITY: remote
  EXPO_PUBLIC_NUTRITION_DEPLOYMENT_MODE: test
  EXPO_PUBLIC_NUTRITION_API_URL: http://127.0.0.1:8000

jobs:
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run config:validate
      - run: npm run typecheck
      - run: npm test -- --runInBand
      # Informational only: Expo publishes patch releases independently of this repo.
      - name: Expo dependency drift (non-blocking)
        continue-on-error: true
        run: npm exec -- expo install --check

  backend:
    # The FastAPI/PostgreSQL backend is parked; keep a fast unit run so it does not rot.
    name: Backend (parked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check .
      - run: >-
          python -m pytest -q
          -m "not postgres_concurrency and not phase5c_performance_t0 and
          not phase5c4_control_postgres and not phase5c4_minio and
          not phase5c4_docker_integration"
