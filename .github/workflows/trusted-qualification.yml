name: Trusted qualification

run-name: >-
  Trusted qualification
  ${{ inputs.task_id }}
  ${{ inputs.dispatch_nonce }}
  ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Authorized task ID
        required: true
        type: string
      issue_number:
        description: GitHub issue number
        required: true
        type: string
      authorization_revision:
        description: External authorization revision
        required: true
        type: string
      authorization_comment_id:
        description: Exact authorization comment ID
        required: true
        type: string
      authorization_payload_sha256:
        description: Canonical authorization payload digest
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit
        required: true
        type: string
      candidate_ref:
        description: Temporary exact-candidate ref
        required: true
        type: string
      dispatch_nonce:
        description: Unique dispatch correlation nonce
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    trusted-qualification-${{ inputs.issue_number }}-${{
    inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  handoff:
    name: Trusted qualification dispatch handoff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate and package trusted handoff
        env:
          TASK_ID: ${{ inputs.task_id }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          AUTHORIZATION_REVISION: ${{ inputs.authorization_revision }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
          AUTHORIZATION_PAYLOAD_SHA256: ${{ inputs.authorization_payload_sha256 }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          values = {
              "task_id": os.environ["TASK_ID"],
              "issue_number": os.environ["ISSUE_NUMBER"],
              "authorization_revision": os.environ["AUTHORIZATION_REVISION"],
              "authorization_comment_id": os.environ["AUTHORIZATION_COMMENT_ID"],
              "authorization_payload_sha256": os.environ[
                  "AUTHORIZATION_PAYLOAD_SHA256"
              ],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_ref": os.environ["CANDIDATE_REF"],
              "dispatch_nonce": os.environ["DISPATCH_NONCE"],
          }

          patterns = {
              "task_id": r"[A-Za-z0-9][A-Za-z0-9._-]{0,99}",
              "issue_number": r"[1-9][0-9]*",
              "authorization_revision": r"[1-9][0-9]*",
              "authorization_comment_id": r"[1-9][0-9]*",
              "authorization_payload_sha256": r"[0-9a-f]{64}",
              "candidate_sha": r"[0-9a-f]{40}",
              "dispatch_nonce": r"[0-9a-f]{24}",
          }

          for key, pattern in patterns.items():
              if re.fullmatch(pattern, values[key]) is None:
                  raise SystemExit(
                      f"TRUSTED_HANDOFF_FIELD_INVALID:{key}"
                  )

          expected_ref = (
              "task-candidate/"
              + values["issue_number"]
              + "/"
              + values["dispatch_nonce"]
              + "/"
              + values["candidate_sha"][:12]
          )

          if values["candidate_ref"] != expected_ref:
              raise SystemExit(
                  "TRUSTED_HANDOFF_CANDIDATE_REF_INVALID"
              )

          document = {
              "schema_version": 1,
              **values,
          }

          Path(
              "trusted-qualification-dispatch.json"
          ).write_text(
              json.dumps(
                  document,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload trusted qualification handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trusted-qualification-dispatch
          path: trusted-qualification-dispatch.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
