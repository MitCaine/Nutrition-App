version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Backend installs are authoritative from the pip-compile generated
  # requirements-dev.lock. Dependabot version PRs against pyproject.toml do
  # not regenerate that lock, so they do not actually qualify the proposed
  # package version. Keep security updates enabled, but handle routine backend
  # version upgrades through lock regeneration and repository qualification.
  - package-ecosystem: pip
    directory: "/apps/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
    # Routine automation is intentionally limited to in-major maintenance.
    # Major dependency changes are migrations and are handled deliberately.
    # GitHub documents that update-types affects version updates, not security
    # updates, so Dependabot security updates remain enabled.
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      mobile-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Expo SDK 57 owns compatibility for these runtime/toolchain packages.
    # Hold routine version updates until the next deliberate Expo migration;
    # security updates are not suppressed by these version-update rules.
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-test-renderer"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@react-native/jest-preset"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-svg"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    open-pull-requests-limit: 3
