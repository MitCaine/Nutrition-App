version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Backend installs are authoritative from the pip-compile generated
  # requirements-dev.lock. Dependabot version PRs against pyproject.toml do
  # not regenerate that lock, so they do not actually qualify the proposed
  # package version. Keep security updates enabled, but handle routine backend
  # version upgrades through lock regeneration and repository qualification.
  - package-ecosystem: pip
    directory: "/apps/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
    groups:
      mobile-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Expo SDK 57 owns compatibility for the React/React Native runtime and
    # its Jest/TypeScript toolchain. Routine Dependabot version bumps for
    # these packages can produce installable but unsupported combinations.
    # These version-update ignores do not suppress Dependabot security
    # updates; compatibility-sensitive upgrades are handled with Expo SDK
    # migrations and qualified as a unit.
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-test-renderer"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@react-native/jest-preset"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 3
