version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 1

  # Backend installs are authoritative from the pip-compile generated
  # requirements-dev.lock. Dependabot version PRs against pyproject.toml do
  # not regenerate that lock, so they do not actually qualify the proposed
  # package version. Keep security updates enabled, but handle routine backend
  # version upgrades through lock regeneration and repository qualification.
  - package-ecosystem: pip
    directory: "/apps/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
    # Routine version refreshes run through scripts/start-work.zsh. GitHub's
    # zero version-PR limit leaves security updates active.
    groups:
      mobile-security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 0
